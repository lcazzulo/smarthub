# Configuration for the controller; parse with heating_controller.load_config.
# Null credential fields mean no authentication; control values remain provisional.
version: 1

general:
  dry_run: true
  timezone: Europe/Rome

  mqtt:
    host: mosquitto # Docker Compose service hostname on the shared network.
    port: 1883
    control_base_topic: heating-controller # Room target command/state namespace.
    username_env: null # No authentication required.
    password_env: null # No authentication required.

  zigbee2mqtt:
    base_topic: zigbee2mqtt # Verified in zigbee2mqtt/data/configuration.yaml.

  # Daily local-time intervals: {start: "HH:MM", end: "HH:MM"}.
  # Start inclusive, end exclusive; end before start means overnight.
  # Empty means heating is unavailable all day. Equal endpoints are invalid.
  supply_intervals:
    - start: "06:00"
      end: "12:00"
    - start: "16:00"
      end: "22:00"

  control:
    period_seconds: 10 # Evaluate each room every 10 seconds using elapsed time.
    # Change-based freshness: repeated temperature values do not refresh age.
    # A stable temperature becomes stale too; this is not sensor liveness detection.
    measurement_max_age_seconds: 21600 # Six hours without a temperature change.
    # Provisional limits for ordinary opening adjustments per valve.
    # Required closure bypasses these; temperature forwarding needs its own policy.
    command_min_interval_seconds: 60
    opening_change_threshold_percent: 5

  # PI output is requested opening percentage, not measured heat output.
  # kp: percentage points per degree C; ki: percentage points per degree C per second.
  # Integral bounds apply to the integral contribution in percentage points.
  # Parsing placeholders only: these gains are not tuned or validated for actuation.
  pi_defaults:
    kp: 10.0
    ki: 0.01
    integral_min: 0.0
    integral_max: 100.0

  # Provisional actuator settings; select only after hardware validation.
  actuator:
    external_sensor_mode: external # Use installed Z2M enum; newer versions use remote_temperature.
    trv_setpoint_margin_c: 5.0 # Provisional: room target + margin; closure/recovery unverified.
    # Provisional transport policies, not verified device fallback timeouts.
    temperature_min_interval_seconds: 60
    temperature_refresh_seconds: 300
    report_timeout_seconds: 60
    report_max_age_seconds: 900
    max_command_attempts: 3

# Device handles are the exact Zigbee2MQTT friendly_name, not HA entity IDs.
# Disabled rooms include friendly names reserved for future devices.
# Derive state topics as <base_topic>/<friendly_name> and valve command
# topics as <base_topic>/<friendly_name>/set. Renames require config updates.
rooms:
  - id: bedroom
    name: Bedroom
    enabled: true
    target_temperature_c: 30.5 # Acquisition/PI example only: target + margin exceeds the TRV's 35°C limit.
    thermometer:
      model: SNZB-02D
      friendly_name: bedroom_thermometer
    valve:
      model: TRVZB
      friendly_name: bedroom_valve
    pi: {} # Optional overrides of general.pi_defaults.

  - id: bathroom
    name: Bathroom
    enabled: true
    target_temperature_c: 30.5
    thermometer:
      model: SNZB-02D
      friendly_name: bathroom_thermometer
    valve:
      model: TRVZB
      friendly_name: bathroom_valve
    pi: {}

  - id: kitchen
    name: Kitchen
    enabled: false
    target_temperature_c: 30.5
    thermometer:
      model: SNZB-02D
      friendly_name: kitchen_thermometer
    valve:
      model: TRVZB
      friendly_name: kitchen_valve
    pi: {}

  - id: living_room
    name: Livingroom
    enabled: false
    target_temperature_c: 30.5
    thermometer:
      model: SNZB-02D
      friendly_name: livingroom_thermometer
    valve:
      model: TRVZB
      friendly_name: livingroom_valve
    pi: {}
