mqtt:
  host: mosquitto
  port: 1883

detectors:
  cpu1:
    type: cpu

objects:
  track:
    - person

snapshots:
  enabled: true
  retain:
    default: 31

cameras:
  reolink_e1:
    ffmpeg:
      input_args: preset-rtsp-generic
      inputs:
        - path:
            rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@192.168.20.10:554/h264Preview_01_sub
          roles:
            - detect

        - path:
            rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@192.168.20.10:554/h264Preview_01_main
          roles:
            - record

    detect:
      width: 896
      height: 512
      fps: 3

    record:
      enabled: true

      motion:
        days: 31

      alerts:
        retain:
          days: 31
          mode: motion

      detections:
        retain:
          days: 31
          mode: motion

    motion:
      mask: 0.289,0.004,0.287,0.111,0.72,0.113,0.723,0
version: 0.17-0
