mqtt:
  host: mosquitto
  port: 1883

detectors:
  cpu1:
    type: cpu

objects:
  track:
    - person

cameras:
  reolink_e1:
    ffmpeg:
      input_args: preset-rtsp-generic
      inputs:
        - path: rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@192.168.20.10:554/h264Preview_01_sub
          roles:
            - detect
    detect:
      width: 896
      height: 512
      fps: 3
version: 0.17-0
