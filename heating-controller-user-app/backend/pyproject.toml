[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthub-heating-user-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "flask-sock>=0.7,<1", "paho-mqtt>=2.1,<3", "PyYAML>=6,<7", "gunicorn>=23,<24"]

[project.optional-dependencies]
test = ["websocket-client>=1.8,<2"]

[tool.setuptools.packages.find]
include = ["heating_app*"]
